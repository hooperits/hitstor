// Workload plugin protocol for HitStor.
//
// Workload plugins are installable packages that teach an agent to back up
// and restore an application (for example a database engine). The agent
// launches the plugin as a subprocess and communicates over this protocol via
// hashicorp/go-plugin. A plugin never talks to the server: the agent owns
// everything that touches the repository.
//
// Protocol version 1 defines discovery only. Backup and restore RPCs are added
// in later revisions of this file without breaking version 1 plugins.

syntax = "proto3";

package hitstor.plugin.v1;

option go_package = "github.com/hooperits/hitstor/api/proto/hitstor/plugin/v1";

import "hitstor/plugin/v1/storage.proto";

// Workload is the gRPC service that workload plugins implement.
service Workload {
  // GetMetadata describes the plugin. The agent calls it when installing a
  // package to confirm the binary matches its manifest, and again whenever it
  // needs the plugin's capabilities.
  rpc GetMetadata(GetMetadataRequest) returns (WorkloadMetadata);

  // Configure passes plugin-specific settings after launch.
  // Reuses ConfigureRequest/ConfigureResponse from storage.proto.
  rpc Configure(ConfigureRequest) returns (ConfigureResponse);
}

message GetMetadataRequest {}

// WorkloadMetadata identifies a plugin and what it can do.
message WorkloadMetadata {
  // Plugin id; must equal the id in the package manifest.
  string id = 1;
  // Human-readable name.
  string name = 2;
  // Plugin version (semver); must equal the version in the package manifest.
  string version = 3;
  // Workload protocol version the plugin implements.
  int32 protocol_version = 4;
  // One-line description.
  string description = 5;
  // Capability identifiers, e.g. "backup.full", "restore.point_in_time".
  repeated string capabilities = 6;
}
