{{define "content"}}
<div id="logs-app" class="logs-page">
    <div id="logs-flash" class="logs-flash hidden" role="status"></div>

    <section class="stats-section logs-stats" id="logs-stats" aria-label="Log summary">
        <div class="stats-grid stats-grid-compact">
            <div class="stat-card stat-card-compact" id="logs-stat-errors">
                <div class="stat-card-top">
                    <span class="stat-card-label">Errors</span>
                </div>
                <div class="stat-card-value stat-card-value--stale" id="logs-count-errors">0</div>
            </div>
            <div class="stat-card stat-card-compact" id="logs-stat-warns">
                <div class="stat-card-top">
                    <span class="stat-card-label">Warnings</span>
                </div>
                <div class="stat-card-value" id="logs-count-warns">0</div>
            </div>
            <div class="stat-card stat-card-compact" id="logs-stat-info">
                <div class="stat-card-top">
                    <span class="stat-card-label">Info</span>
                </div>
                <div class="stat-card-value stat-card-value--ok" id="logs-count-info">0</div>
            </div>
            <div class="stat-card stat-card-compact">
                <div class="stat-card-top">
                    <span class="stat-card-label">Total</span>
                </div>
                <div class="stat-card-value" id="logs-count-total">0</div>
            </div>
        </div>
    </section>

    <div class="logs-toolbar">
        <div class="logs-filters">
            <label class="logs-filter">
                <span>Source</span>
                <select id="logs-source">
                    <option value="all">All sources</option>
                    <option value="server">Server</option>
                    <option value="system">System (OS)</option>
                </select>
            </label>
            <label class="logs-filter">
                <span>Level</span>
                <select id="logs-level">
                    <option value="">All levels</option>
                    <option value="debug">Debug</option>
                    <option value="info">Info</option>
                    <option value="warn">Warn</option>
                    <option value="error">Error</option>
                </select>
            </label>
            <label class="logs-filter">
                <span>Since</span>
                <select id="logs-since">
                    <option value="">All time</option>
                    <option value="15m">Last 15 minutes</option>
                    <option value="1h">Last hour</option>
                    <option value="24h">Last 24 hours</option>
                    <option value="7d">Last 7 days</option>
                </select>
            </label>
            <label class="logs-filter logs-filter--search">
                <span>Search</span>
                <div class="logs-search-wrap">
                    <input type="search" id="logs-query" placeholder="Filter messages…" autocomplete="off">
                    <button type="button" class="logs-search-clear hidden" id="logs-query-clear" aria-label="Clear search">&times;</button>
                </div>
            </label>
        </div>
        <div class="logs-actions">
            <label class="logs-auto">
                <input type="checkbox" id="logs-follow-tail" checked>
                <span>Follow tail</span>
            </label>
            <label class="logs-auto">
                <input type="checkbox" id="logs-auto-refresh" checked>
                <span>Auto-refresh</span>
            </label>
            <button type="button" class="btn btn-secondary btn-sm" id="logs-refresh">Refresh</button>
            <button type="button" class="btn btn-secondary btn-sm" id="logs-copy-link">Copy link</button>
            <div class="logs-export-dropdown">
                <button type="button" class="btn btn-secondary btn-sm" id="logs-export-toggle" aria-haspopup="true" aria-expanded="false">Export ▾</button>
                <div class="logs-export-menu hidden" id="logs-export-menu" role="menu">
                    <button type="button" role="menuitem" data-export="jsonl">JSONL</button>
                    <button type="button" role="menuitem" data-export="text">Plain text</button>
                    <button type="button" role="menuitem" data-export="csv">CSV</button>
                </div>
            </div>
        </div>
    </div>

    <p id="logs-meta" class="logs-meta"></p>
    <details id="logs-warnings-wrap" class="logs-warnings-wrap hidden">
        <summary>Source warnings</summary>
        <ul id="logs-warnings" class="logs-warnings-list"></ul>
    </details>

    <div class="table-wrap logs-table-panel" id="logs-table-panel">
        <table class="logs-table" id="logs-table">
            <thead>
                <tr>
                    <th class="logs-col-time">Time</th>
                    <th class="logs-col-level">Level</th>
                    <th class="logs-col-source">Source</th>
                    <th class="logs-col-message">Message</th>
                    <th class="logs-col-actions" aria-label="Actions"></th>
                </tr>
            </thead>
            <tbody id="logs-tbody">
                <tr class="logs-row-empty"><td colspan="5">Loading logs…</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script src="/static/logs.js"></script>
{{end}}
