name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # The plugin signing key is a secret of the "release" environment, which
    # only accepts deployments from v* tags.
    environment: release
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis python3-pil
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.44.0

      - name: Test
        run: go test ./...

      - name: Build release assets
        run: make release-assets VERSION="${GITHUB_REF_NAME#v}"

      # Only this step receives the signing key. Packages are then verified
      # against the official keys embedded in the agent, so a wrong or
      # missing secret fails the release instead of shipping packages that
      # agents would reject.
      - name: Build signed plugin packages
        env:
          HITSTOR_PLUGIN_SIGNING_KEY: ${{ secrets.HITSTOR_PLUGIN_SIGNING_KEY }}
        run: |
          make plugin-packages VERSION="${GITHUB_REF_NAME#v}"
          for p in dist/*.hpk; do bin/hitstor-pluginkit verify "$p"; done
          make checksums

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "HitStor $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
