// Hook plugin protocol for HitStor.
//
// Plugin binaries implement this gRPC service. The host (hitstor) launches
// the plugin as a subprocess and communicates over this protocol via
// hashicorp/go-plugin.

syntax = "proto3";

package hitstor.plugin.v1;

option go_package = "github.com/hooperits/hitstor/api/proto/hitstor/plugin/v1";

import "hitstor/plugin/v1/storage.proto";

// Hook is the gRPC service that hook plugins implement.
// Each RPC corresponds to a method on the hook.Hook Go interface.
service Hook {
  // Configure passes plugin-specific settings after launch.
  // Called exactly once before any hook call.
  // Reuses ConfigureRequest/ConfigureResponse from storage.proto.
  rpc Configure(ConfigureRequest) returns (ConfigureResponse);

  // PreBackup is called before a backup starts.
  // Returning a gRPC error aborts the backup.
  rpc PreBackup(HookRequest) returns (HookResponse);

  // PostBackup is called after a backup completes successfully.
  // Errors are logged but do not affect the backup result.
  rpc PostBackup(HookRequest) returns (HookResponse);
}

// HookRequest carries context about a backup operation.
message HookRequest {
  // Agent name (or hostname for local backups).
  string agent = 1;
  // Machine hostname.
  string hostname = 2;
  // Backup source paths.
  repeated string paths = 3;
  // Exclude glob patterns.
  repeated string excludes = 4;
  // Backup tags.
  repeated string tags = 5;
  // Snapshot ID (set in PostBackup only; empty in PreBackup).
  string snapshot_id = 6;
  // Arbitrary key-value details.
  map<string, string> details = 7;
}

message HookResponse {}
