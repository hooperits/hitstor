            Retention: Retención
            Disaster Recovery: Recuperación ante desastres
            Bare-Metal Restore: Restauración bare-metal
            Plugins: Plugins
            Administration: Administración
            Server Setup: Puesta en marcha del servidor
            TLS Certificates: Certificados TLS
            Backup Jobs: Tareas de respaldo
            Agent Management: Administración de agentes
            Agent Discovery: Descubrimiento de agentes
            Agent Deployment: Despliegue de agentes
            Scheduling: Programación
            Dashboard: Dashboard
