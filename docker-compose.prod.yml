services:
  hitstor:
    build:
      context: .
      args:
        VERSION: "${HITSTOR_VERSION:-dev}"
    image: hitstor:${HITSTOR_VERSION:-latest}
    ports:
      - "8420:8420"    # gRPC server
      - "8421:8421"    # Web dashboard
    volumes:
      - hitstor-data:/var/lib/hitstor
      - ./config:/etc/hitstor:ro
    environment:
      - HITSTOR_PASSWORD=${HITSTOR_PASSWORD:-}
      - HITSTOR_REPO=/var/lib/hitstor/repo
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null --no-check-certificate https://localhost:8421/login || wget -q -O /dev/null http://localhost:8421/login"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  hitstor-data:
